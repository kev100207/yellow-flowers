<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para una Gran Amiga 🌻</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: radial-gradient(circle at center, #1b263b 0%, #0d1b2a 60%, #020813 100%);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
    }

    /* Fondo animado de luz */
    .glow-bg {
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255, 215, 0, 0.15);
      filter: blur(100px);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      animation: pulse 4s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
    }

    /* Contenedor de flores flotantes */
    #flowers-container {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    .flower {
      position: absolute;
      user-select: none;
      animation: floatUp linear infinite;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) rotate(0deg) scale(0.5);
        opacity: 0;
      }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% {
        transform: translateY(-15vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* Tarjeta del mensaje */
    .card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 88%;
      max-width: 400px;
      background: rgba(13, 27, 42, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 2px solid rgba(255, 215, 0, 0.5);
      border-radius: 25px;
      padding: 30px 20px;
      text-align: center;
      color: #ffffff;
      z-index: 10;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.35);
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -45%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }

    .card h1 {
      color: #ffd700;
      font-size: 2.1rem;
      margin-bottom: 15px;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
    }

    .card p {
      color: #f1f5f9;
      font-size: 1.15rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .tag {
      display: inline-block;
      background: rgba(255, 215, 0, 0.2);
      color: #ffe066;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 215, 0, 0.4);
    }
  </style>
</head>
<body>

  <div class="glow-bg"></div>
  <div id="flowers-container"></div>

  <div class="card">
    <h1>¡Feliz Día, Amiga! 🌻</h1>
    <p>Un detalle especial con flores amarillas para agradecerte por tu gran amistad, tus risas y por estar siempre ahí. ✨</p>
    <div class="tag">¡Gracias por tu valiosa amistad! 💛</div>
  </div>

  <script>
    // Generador de flores amarillas y girasoles flotantes
    const container = document.getElementById('flowers-container');
    const flowerTypes = ['🌻', '🌼', '✨', '⭐', '💛', '🌻'];

    function createFlower() {
      const flower = document.createElement('div');
      flower.className = 'flower';
      
      // Tipo de flor aleatorio
      flower.innerText = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];
      
      // Tamaño y posición aleatorios
      const size = Math.random() * 25 + 20; // 20px a 45px
      const left = Math.random() * 100; // 0% a 100% de la pantalla
      const duration = Math.random() * 5 + 6; // 6s a 11s de animación
      const delay = Math.random() * 2;

      flower.style.fontSize = `${size}px`;
      flower.style.left = `${left}%`;
      flower.style.animationDuration = `${duration}s`;
      flower.style.animationDelay = `${delay}s`;

      container.appendChild(flower);

      // Eliminar flor tras la animación
      setTimeout(() => {
        flower.remove();
      }, (duration + delay) * 1000);
    }

    // Crear flores continuamente
    setInterval(createFlower, 300);

    // Crear un lote inicial
    for (let i = 0; i < 20; i++) {
      createFlower();
    }
  </script>
</body>
</html>
