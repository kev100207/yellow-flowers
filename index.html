<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Iraida 🌻</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: radial-gradient(circle at center, #1a0210 0%, #0d0008 60%, #030004 100%);
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      width: 100vw;
      color: #fff;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .glow-center {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.25) 0%, rgba(255, 140, 0, 0.1) 50%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      filter: blur(40px);
      z-index: 2;
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.25); opacity: 0.95; }
    }

    .card {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 450px;
      background: rgba(20, 5, 18, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 215, 0, 0.45);
      border-radius: 24px;
      padding: 24px 22px;
      text-align: center;
      z-index: 10;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.3), inset 0 0 15px rgba(255, 215, 0, 0.1);
      animation: fadeInUp 1.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translate(-50%, 40px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .card h1 {
      font-family: 'Dancing Script', cursive;
      color: #ffd700;
      font-size: 2.3rem;
      margin-bottom: 8px;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
    }

    .poem {
      font-size: 0.96rem;
      line-height: 1.6;
      color: #fff8dc;
      font-style: italic;
      margin: 12px 0;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }

    .dedication {
      font-size: 0.88rem;
      color: #ffd700;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 10px;
      border-top: 1px solid rgba(255, 215, 0, 0.3);
      padding-top: 10px;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="glow-center"></div>

  <div class="card">
    <h1>Para Iraida 🌻✨</h1>
    <div class="poem">
      "Como el girasol que busca siempre la luz del sol,<br>
      tu presencia ilumina cada espacio con alegría.<br>
      Que nunca falten flores amarillas en tu camino,<br>
      ni motivos para brillar cada día."
    </div>
    <div class="dedication">Con mucho cariño 💛</div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 7;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Partículas doradas
    const particleCount = 2800;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      const radius = Math.random() * 8 + 0.5;
      const spinAngle = radius * 1.8;
      const branchAngle = ((i % 5) / 5) * Math.PI * 2;

      positions[i] = Math.cos(branchAngle + spinAngle) * radius;
      positions[i + 1] = (Math.random() - 0.5) * 3;
      positions[i + 2] = Math.sin(branchAngle + spinAngle) * radius;

      colors[i] = 1.0; 
      colors[i + 1] = 0.8 + Math.random() * 0.2; 
      colors[i + 2] = Math.random() * 0.25; 
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const particleMaterial = new THREE.PointsMaterial({
      size: 0.055,
      vertexColors: true,
      transparent: true,
      opacity: 0.9
    });

    const particleSystem = new THREE.Points(geometry, particleMaterial);
    scene.add(particleSystem);

    // Girasoles 3D girando
    function createSunflowerTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.beginPath();
      ctx.arc(64, 64, 20, 0, Math.PI * 2);
      ctx.fillStyle = '#5c3a21';
      ctx.fill();

      const numPetals = 12;
      for (let i = 0; i < numPetals; i++) {
        const angle = (i * Math.PI * 2) / numPetals;
        ctx.save();
        ctx.translate(64, 64);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.ellipse(0, -38, 8, 22, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#ffcc00';
        ctx.fill();
        ctx.restore();
      }
      return new THREE.CanvasTexture(canvas);
    }

    const sunflowerTexture = createSunflowerTexture();
    const sunflowerGroup = new THREE.Group();
    const numSunflowers = 12;

    for (let i = 0; i < numSunflowers; i++) {
      const spriteMaterial = new THREE.SpriteMaterial({ map: sunflowerTexture, transparent: true });
      const sprite = new THREE.Sprite(spriteMaterial);
      
      const angle = (i / numSunflowers) * Math.PI * 2;
      const radius = 3.2;
      sprite.position.x = Math.cos(angle) * radius;
      sprite.position.y = Math.sin(angle) * radius * 0.7 + 0.5;
      sprite.position.z = (Math.random() - 0.5) * 2;
      
      sprite.scale.set(0.7, 0.7, 1);
      sunflowerGroup.add(sprite);
    }
    scene.add(sunflowerGroup);

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      particleSystem.rotation.y = elapsedTime * 0.08;
      sunflowerGroup.rotation.z = elapsedTime * 0.15;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
